# /etc/razerd/razerd.conf — extra arguments for razerd.service, which runs
# `razerd --upower $RAZERD_ARGS`. systemd EnvironmentFile= syntax: one
# KEY=value per line, no quotes needed, # starts a comment.
#
# --hold <color>  Also hold a color (red, green, blue, white, off): the daemon
#                 re-applies it whenever the mouse wakes, as `razerd --watch`
#                 does, in the same process as the battery bridge. Leave the
#                 line out, or empty, for the battery alone.
# -v              Log every battery poll and color re-apply (debug), not only
#                 the transitions; -vv adds the trace level. Read them with
#                 `journalctl -u razerd`; `journalctl -p warning -u razerd`
#                 keeps the warnings alone.
#
# Takes effect on `sudo systemctl restart razerd.service`.
RAZERD_ARGS=--hold blue
