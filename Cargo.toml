[package]
name = "razerd"
version = "0.10.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Minimal Razer RGB daemon for Linux"
repository = "https://github.com/GregDuhamel/razerd"
readme = "README.md"
keywords = ["razer", "rgb", "hid", "mouse", "upower"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
anyhow = "1"
libc = "0.2"
uhid-battery = { git = "https://github.com/GregDuhamel/uhid-battery", tag = "v0.1.0" }
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
