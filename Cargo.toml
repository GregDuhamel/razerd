[package]
name = "razerd"
version = "0.11.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Minimal Razer RGB daemon for Linux"
repository = "https://github.com/GregDuhamel/razerd"
readme = "README.md"
keywords = ["razer", "rgb", "hid", "mouse", "upower"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
anyhow = "1"
libc = "0.2"
uhid-battery = { git = "https://github.com/GregDuhamel/uhid-battery", tag = "v0.2.0" }
clap = { version = "4", features = ["derive"] }

[lints.rust]
# `deny` is not possible while hid.rs reaches the hidraw ioctls through
# `libc::ioctl`; it will be once that moves to rustix.
unsafe_code = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
