name: Release

# Tags and publishes what main already says. The version is bumped in the
# pull request that makes the release (Cargo.toml and Cargo.lock, with the
# CHANGELOG entry); this workflow checks the two agree, refuses a version that
# is already tagged, builds the static binary, tags main and publishes the
# release with the binary and its checksum.
#
# It never commits: a commit made here would be unsigned, and main only takes
# signed commits through pull requests. That is also why there is no bump
# input any more - the bump is the pull request's job.

on:
  workflow_dispatch:

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the version main declares
        id: version
        run: |
          version=$(sed -n 's/^version = "\([0-9][0-9.]*\)"/\1/p' Cargo.toml | head -1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml says $version"

      - name: Refuse a version that is already tagged
        run: |
          if git tag --list "v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "::error::v${{ steps.version.outputs.version }} is already tagged: bump the version in a pull request first"
            exit 1
          fi

      - name: Check that Cargo.lock records the same version
        run: |
          lock=$(awk '/^name = "razerd"$/{getline; sub(/^version = "/, ""); sub(/"$/, ""); print; exit}' Cargo.lock)
          if [ "$lock" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Cargo.lock records $lock, Cargo.toml says ${{ steps.version.outputs.version }}: run cargo update --workspace in the pull request"
            exit 1
          fi

      # A static binary: razerd links no C library (its system calls go
      # through rustix; the `libc` crate under signal-hook is bindings), so
      # the musl target makes one that runs on any x86_64 Linux, whatever its
      # glibc. The target's standard library is the only thing to add.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo build --release (static, musl)
        run: cargo build --locked --release --target x86_64-unknown-linux-musl

      # Not a binary that happens to work on the runner: the kernel is the
      # only thing it may need. Rust makes the musl binary a static PIE,
      # which `file` reports as "static-pie linked" (older versions:
      # "statically linked"); a "dynamically linked" one fails the release.
      - name: Check the binary is statically linked
        run: |
          file target/x86_64-unknown-linux-musl/release/razerd | tee /dev/stderr | grep -Eq 'static(ally|-pie) linked'

      - name: Tag main
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      # The asset keeps its name (installs in the field script it), and
      # SHA256SUMS lets `sha256sum -c` check the download (see the README).
      - name: Name the binary and write the checksums
        run: |
          cp target/x86_64-unknown-linux-musl/release/razerd razerd-x86_64-linux
          sha256sum razerd-x86_64-linux > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            razerd-x86_64-linux
            SHA256SUMS
          generate_release_notes: true
