name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          current=${latest#v}
          current=${current:-0.0.0}
          IFS='.' read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

      - name: Update Cargo.toml version
        run: sed -i 's/^version = .*/version = "${{ steps.version.outputs.version }}"/' Cargo.toml

      # A static binary: razerd links no C library (its system calls go
      # through rustix; the `libc` crate under signal-hook is bindings), so
      # the musl target makes one that runs on any x86_64 Linux, whatever its
      # glibc. The target's standard library is the only thing to add.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # The bump above leaves Cargo.lock's own `razerd` entry behind; sync
      # only that so the build can be `--locked` like CI's.
      - name: Sync Cargo.lock with the bumped version
        run: cargo update --workspace

      - name: cargo build --release (static, musl)
        run: cargo build --locked --release --target x86_64-unknown-linux-musl

      # Not a binary that happens to work on the runner: the kernel is the
      # only thing it may need. Rust makes the musl binary a static PIE,
      # which `file` reports as "static-pie linked" (older versions:
      # "statically linked"); a "dynamically linked" one fails the release.
      - name: Check the binary is statically linked
        run: |
          file target/x86_64-unknown-linux-musl/release/razerd | tee /dev/stderr | grep -Eq 'static(ally|-pie) linked'

      - name: Commit version bump and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet Cargo.toml Cargo.lock; then
            git add Cargo.toml Cargo.lock
            git commit -m "chore: release v${{ steps.version.outputs.version }}"
            git push origin main
          fi
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      # The asset keeps its name (installs in the field script it), and
      # SHA256SUMS lets `sha256sum -c` check the download (see the README).
      - name: Name the binary and write the checksums
        run: |
          cp target/x86_64-unknown-linux-musl/release/razerd razerd-x86_64-linux
          sha256sum razerd-x86_64-linux > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            razerd-x86_64-linux
            SHA256SUMS
          generate_release_notes: true
