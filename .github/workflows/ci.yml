name: CI

# rustfmt, clippy, build and tests (unit, integration, doc) on stable and on
# the MSRV, rustdoc and cargo audit, all with warnings denied: the Rust CI
# shared by this author's repositories, kept in uhid-battery.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The token only needs to read the repository: no job here writes anything.
permissions:
  contents: read

jobs:
  rust:
    uses: GregDuhamel/uhid-battery/.github/workflows/rust-ci.yml@main
    with:
      # The MSRV declared in Cargo.toml.
      msrv: "1.85"
      doc-private-items: true

  release-build:
    name: Build (release)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo build --release
        run: cargo build --locked --release
