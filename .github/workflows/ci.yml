name: CI

# rustfmt, clippy, build and tests (unit, integration, doc) on stable and on
# the MSRV, rustdoc and cargo audit, all with warnings denied: the Rust CI
# shared by this author's repositories, kept in uhid-battery.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The token only needs to read the repository: no job here writes anything.
permissions:
  contents: read

jobs:
  rust:
    uses: GregDuhamel/uhid-battery/.github/workflows/rust-ci.yml@main
    with:
      # The MSRV declared in Cargo.toml.
      msrv: "1.85"
      doc-private-items: true

  release-build:
    name: Build (release)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --locked --release
